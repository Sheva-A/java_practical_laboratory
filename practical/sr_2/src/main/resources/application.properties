spring.application.name=demo
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/cameradb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

camera.api.list-path=/da8f-feef-4b02-9ca0

spring.cloud.openfeign.client.config.camera-client.connectTimeout=10000
spring.cloud.openfeign.client.config.camera-client.readTimeout=20000
